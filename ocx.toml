#:schema https://ocx.sh/schemas/project/v1.json
# OCX project toolchain for the mirror-nodejs sibling repo.
#
# `uv` is the runtime for the PEP 723 url_index generator
# (`node/scripts/generate.py`). Namespaced coordinate only — the flat
# `ocx.sh/uv` dies with the `ocx.sh` host.

[tools]
cli = "ocx.sh/ocx/cli:0.6"
mirror = "ocx.sh/ocx/mirror:0.6"
uv = "ocx.sh/astral-sh/uv:0"
